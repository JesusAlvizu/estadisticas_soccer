version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: estadisticas_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-estadisticas_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estadisticas_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: estadisticas_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estadisticas_network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: estadisticas_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estadisticas_network

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estadisticas_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-estadisticas_db}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      API_KEY_FOOTBALL: ${API_KEY_FOOTBALL:-}
      API_KEY_SPORTS: ${API_KEY_SPORTS:-}
      SPORTMONKS_API_KEY: ${SPORTMONKS_API_KEY:-}
      SPORTMONKS_BASE_URL: ${SPORTMONKS_BASE_URL:-https://api.sportmonks.com/v3/football}
      SPORTMONKS_LEAGUE_ID: ${SPORTMONKS_LEAGUE_ID:-262}
      LIGA_MX_SYNC_ENABLED: ${LIGA_MX_SYNC_ENABLED:-true}
      LIGA_MX_LEAGUE_ID: ${LIGA_MX_LEAGUE_ID:-262}
      LIGA_MX_SEASON: ${LIGA_MX_SEASON:-2026}
      LIGA_MX_TOURNAMENT_START: ${LIGA_MX_TOURNAMENT_START:-}
      LIGA_MX_TOURNAMENT_END: ${LIGA_MX_TOURNAMENT_END:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - estadisticas_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estadisticas_celery_worker
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-estadisticas_db}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_KEY_FOOTBALL: ${API_KEY_FOOTBALL:-}
      SPORTMONKS_API_KEY: ${SPORTMONKS_API_KEY:-}
      SPORTMONKS_BASE_URL: ${SPORTMONKS_BASE_URL:-https://api.sportmonks.com/v3/football}
      SPORTMONKS_LEAGUE_ID: ${SPORTMONKS_LEAGUE_ID:-262}
      LIGA_MX_SYNC_ENABLED: ${LIGA_MX_SYNC_ENABLED:-true}
      LIGA_MX_LEAGUE_ID: ${LIGA_MX_LEAGUE_ID:-262}
      LIGA_MX_SEASON: ${LIGA_MX_SEASON:-2026}
      LIGA_MX_TOURNAMENT_START: ${LIGA_MX_TOURNAMENT_START:-}
      LIGA_MX_TOURNAMENT_END: ${LIGA_MX_TOURNAMENT_END:-}
    depends_on:
      - postgres
      - redis
      - rabbitmq
    volumes:
      - ./backend:/app
    networks:
      - estadisticas_network
    command: celery -A app.tasks.celery_app:app worker --loglevel=info --concurrency=4

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estadisticas_celery_beat
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-estadisticas_db}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_KEY_FOOTBALL: ${API_KEY_FOOTBALL:-}
      SPORTMONKS_API_KEY: ${SPORTMONKS_API_KEY:-}
      SPORTMONKS_BASE_URL: ${SPORTMONKS_BASE_URL:-https://api.sportmonks.com/v3/football}
      SPORTMONKS_LEAGUE_ID: ${SPORTMONKS_LEAGUE_ID:-262}
      LIGA_MX_SYNC_ENABLED: ${LIGA_MX_SYNC_ENABLED:-true}
      LIGA_MX_LEAGUE_ID: ${LIGA_MX_LEAGUE_ID:-262}
      LIGA_MX_SEASON: ${LIGA_MX_SEASON:-2026}
      LIGA_MX_TOURNAMENT_START: ${LIGA_MX_TOURNAMENT_START:-}
      LIGA_MX_TOURNAMENT_END: ${LIGA_MX_TOURNAMENT_END:-}
    depends_on:
      - postgres
      - redis
      - rabbitmq
    volumes:
      - ./backend:/app
    networks:
      - estadisticas_network
    command: celery -A app.tasks.celery_app:app beat --loglevel=info

  # Frontend NextJS
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: estadisticas_frontend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_BASEURL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - estadisticas_network
    command: npm run dev

  # PgAdmin (PostgreSQL Admin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: estadisticas_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - estadisticas_network
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  pgadmin_data:

networks:
  estadisticas_network:
    driver: bridge
